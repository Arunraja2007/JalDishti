<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40916c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f4c81" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Outer Watershed Contour Ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="6,3"/>
  <circle cx="50" cy="50" r="41" fill="#f0fdf4" opacity="0.6"/>

  <!-- Left Nature Leaf -->
  <path d="M 50 16 C 30 26 22 46 25 64 C 28 78 40 84 50 84 C 50 84 46 68 46 52 C 46 36 50 16 50 16 Z" fill="url(#leafGrad)"/>
  <path d="M 46 52 Q 36 44 32 38" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 47 62 Q 38 58 35 52" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Right Water Drop & River Stream -->
  <path d="M 50 16 C 50 16 75 42 75 62 C 75 75 64 84 50 84 C 53 74 55 60 55 48 C 55 34 50 16 50 16 Z" fill="url(#dropGrad)"/>
  <!-- Highlight on drop -->
  <ellipse cx="62" cy="58" rx="4" ry="9" transform="rotate(-25 62 58)" fill="#ffffff" opacity="0.45"/>

  <!-- Center Hydrological Node -->
  <circle cx="50" cy="50" r="3.5" fill="#ffffff"/>
  <circle cx="50" cy="50" r="2" fill="#0f4c81"/>
</svg>
