<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="drySky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#fed7aa"/></linearGradient>
    <linearGradient id="ravineSoil" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ca8a04"/><stop offset="50%" stop-color="#854d0e"/><stop offset="100%" stop-color="#451a03"/></linearGradient>
  </defs>
  <!-- Background Dry Hazy Sky -->
  <rect width="600" height="400" fill="url(#drySky)"/>
  
  <!-- Ravine Landscape Plateau -->
  <polygon points="0,180 220,180 260,240 340,240 380,170 600,170 600,400 0,400" fill="#a16207"/>
  
  <!-- Deep Fractured Ravine Gully Chasm -->
  <polygon points="200,180 270,300 310,400 240,400 160,260 0,280 0,400 600,400 600,320 400,280 360,210 380,170" fill="url(#ravineSoil)"/>
  
  <!-- Soil Strata & Erosion Rills -->
  <path d="M 60 200 Q 140 220 200 260 M 80 240 Q 150 270 230 310" stroke="#713f12" stroke-width="3" fill="none"/>
  <path d="M 420 200 Q 360 250 320 320 M 480 240 Q 400 290 350 360" stroke="#713f12" stroke-width="3" fill="none"/>
  
  <!-- Sparse thorny scrub vegetation on rim -->
  <circle cx="90" cy="175" r="14" fill="#65a30d" opacity="0.8"/>
  <circle cx="140" cy="178" r="10" fill="#4d7c0f" opacity="0.8"/>
  <circle cx="480" cy="165" r="16" fill="#65a30d" opacity="0.8"/>
  <circle cx="530" cy="168" r="12" fill="#4d7c0f" opacity="0.8"/>
  
  <!-- Proposed Intervention Stakes (Survey Markers) -->
  <line x1="250" y1="280" x2="250" y2="250" stroke="#dc2626" stroke-width="3"/>
  <polygon points="250,250 265,255 250,260" fill="#ef4444"/>
  <line x1="330" y1="290" x2="330" y2="260" stroke="#dc2626" stroke-width="3"/>
  <polygon points="330,260 345,265 330,270" fill="#ef4444"/>
  
  <!-- Warning / Critical Erosion Badge -->
  <rect x="20" y="20" width="230" height="64" rx="6" fill="#0f172a" fill-opacity="0.85"/>
  <text x="32" y="42" fill="#f87171" font-family="monospace" font-size="12" font-weight="bold">GEO-OBS: ERO-08 (24.789°N, 76.014°E)</text>
  <text x="32" y="60" fill="#fde047" font-family="sans-serif" font-size="11">Active Gully Erosion • Chambal Ravines</text>
  <text x="32" y="74" fill="#cbd5e1" font-family="sans-serif" font-size="10">Progression: 1.8m/yr | Risk: Critical (91)</text>
</svg>
