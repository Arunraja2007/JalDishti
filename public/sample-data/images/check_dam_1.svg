<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="100%" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2d6a4f"/><stop offset="100%" stop-color="#1b4332"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0369a1"/></linearGradient>
    <linearGradient id="masonry" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#78716c"/><stop offset="50%" stop-color="#a8a29e"/><stop offset="100%" stop-color="#78716c"/></linearGradient>
  </defs>
  <!-- Background Sky -->
  <rect width="600" height="400" fill="url(#sky)"/>
  <!-- Distant Hills -->
  <path d="M 0 160 Q 150 110 300 150 T 600 130 L 600 400 L 0 400 Z" fill="url(#hills)" opacity="0.6"/>
  <path d="M 0 190 Q 200 140 420 190 T 600 170 L 600 400 L 0 400 Z" fill="#40916c" opacity="0.75"/>
  <!-- Upstream Water Reservoir -->
  <path d="M 80 220 C 180 210 420 210 520 220 L 520 280 L 80 280 Z" fill="url(#water)"/>
  <ellipse cx="300" cy="240" rx="180" ry="16" fill="#38bdf8" opacity="0.4"/>
  <!-- Masonry Check Dam Wall -->
  <polygon points="100,260 500,260 530,340 70,340" fill="url(#masonry)"/>
  <!-- Masonry Texture lines -->
  <line x1="120" y1="280" x2="480" y2="280" stroke="#57534e" stroke-width="2"/>
  <line x1="90" y1="310" x2="510" y2="310" stroke="#57534e" stroke-width="2"/>
  <line x1="200" y1="260" x2="200" y2="340" stroke="#57534e" stroke-width="1.5" stroke-dasharray="8,6"/>
  <line x1="300" y1="260" x2="300" y2="340" stroke="#57534e" stroke-width="1.5" stroke-dasharray="8,6"/>
  <line x1="400" y1="260" x2="400" y2="340" stroke="#57534e" stroke-width="1.5" stroke-dasharray="8,6"/>
  <!-- Central Spillway Crest -->
  <polygon points="240,250 360,250 360,270 240,270" fill="#d6d3d1"/>
  <!-- Water Cascading from Spillway -->
  <path d="M 245 270 Q 250 320 230 360 L 370 360 Q 350 320 355 270 Z" fill="#7dd3fc" opacity="0.85"/>
  <!-- Downstream Plunge Pool & Apron -->
  <polygon points="40,340 560,340 590,400 10,400" fill="#52525b"/>
  <path d="M 120 360 C 220 350 380 350 480 360 L 520 400 L 80 400 Z" fill="url(#water)"/>
  <!-- Riverbank Trees & Greenery -->
  <circle cx="60" cy="220" r="35" fill="#1b4332"/>
  <circle cx="85" cy="210" r="28" fill="#2d6a4f"/>
  <circle cx="530" cy="215" r="38" fill="#1b4332"/>
  <circle cx="560" cy="205" r="30" fill="#40916c"/>
  <!-- Geotag HUD Overlay -->
  <rect x="20" y="20" width="220" height="64" rx="6" fill="#0f172a" fill-opacity="0.75"/>
  <text x="32" y="42" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">GEO-OBS: CD-03 (19.012°N, 74.453°E)</text>
  <text x="32" y="60" fill="#86efac" font-family="sans-serif" font-size="11">Masonry Check Dam • PMKSY-WDC</text>
  <text x="32" y="74" fill="#cbd5e1" font-family="sans-serif" font-size="10">Capacity: 12,400 m³ | Status: Functional</text>
</svg>
