<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="hillSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="100%" stop-color="#f0fdf4"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#hillSky)"/>
  <!-- Shivalik Foothills Slope -->
  <polygon points="0,120 600,120 600,400 0,400" fill="#15803d"/>
  <!-- Gully Channel Bed -->
  <polygon points="260,120 340,120 480,400 120,400" fill="#a16207"/>
  <!-- Trapped Silt Wedge Upstream -->
  <polygon points="200,240 400,240 440,310 160,310" fill="#d97706" opacity="0.85"/>
  <!-- Loose Boulder Gully Plug Barrier -->
  <!-- Layer of stone boulders -->
  <g fill="#78716c" stroke="#44403c" stroke-width="2">
    <ellipse cx="180" cy="320" rx="22" ry="16"/>
    <ellipse cx="220" cy="325" rx="24" ry="18"/>
    <ellipse cx="265" cy="322" rx="26" ry="17"/>
    <ellipse cx="315" cy="324" rx="28" ry="19"/>
    <ellipse cx="365" cy="320" rx="25" ry="18"/>
    <ellipse cx="410" cy="322" rx="22" ry="16"/>
    <!-- Top row boulders -->
    <ellipse cx="200" cy="300" rx="20" ry="15"/>
    <ellipse cx="240" cy="298" rx="24" ry="17"/>
    <ellipse cx="290" cy="295" rx="26" ry="18"/>
    <ellipse cx="340" cy="297" rx="25" ry="16"/>
    <ellipse cx="385" cy="302" rx="21" ry="15"/>
  </g>
  <!-- Silt filtration flow -->
  <path d="M 280 340 L 320 340 L 300 380 Z" fill="#0284c7" opacity="0.7"/>
  <ellipse cx="300" cy="375" rx="40" ry="10" fill="#38bdf8" opacity="0.5"/>
  
  <!-- Bhabbar grass planting on gully sides -->
  <g fill="#22c55e">
    <circle cx="140" cy="260" r="14"/><circle cx="150" cy="300" r="16"/>
    <circle cx="450" cy="260" r="14"/><circle cx="440" cy="300" r="16"/>
  </g>
  
  <!-- Geotag HUD Overlay -->
  <rect x="20" y="20" width="240" height="64" rx="6" fill="#0f172a" fill-opacity="0.75"/>
  <text x="32" y="42" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">GEO-OBS: GP-14 (30.762°N, 76.958°E)</text>
  <text x="32" y="60" fill="#86efac" font-family="sans-serif" font-size="11">Loose Boulder Gully Plug • Sukhomajri</text>
  <text x="32" y="74" fill="#cbd5e1" font-family="sans-serif" font-size="10">Sediment Trapped: 68 Tons | Status: Optimal</text>
