<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pondSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="100%" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="cropField" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#52b788"/><stop offset="100%" stop-color="#2d6a4f"/></linearGradient>
    <linearGradient id="pondWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#075985"/></linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#pondSky)"/>
  <!-- Crop Fields & Ground Horizon -->
  <polygon points="0,150 600,150 600,400 0,400" fill="#a7f3d0"/>
  <!-- Field Rows (Ploughed agricultural land) -->
  <path d="M 0 150 L 200 400 M 150 150 L 320 400 M 450 150 L 400 400 M 600 150 L 480 400" stroke="#059669" stroke-width="3" opacity="0.3"/>
  <!-- Farm Pond Embankment -->
  <polygon points="120,200 480,200 540,360 60,360" fill="#78716c"/>
  <polygon points="140,215 460,215 510,345 90,345" fill="#1e293b"/> <!-- HDPE liner black -->
  <polygon points="160,230 440,230 485,335 115,335" fill="url(#pondWater)"/> <!-- Stored Water -->
  
  <!-- Water Reflection / Shimmer -->
  <ellipse cx="300" cy="285" rx="140" ry="25" fill="#38bdf8" opacity="0.35"/>
  <!-- Inlet Silt Trap Structure -->
  <rect x="270" y="185" width="60" height="30" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <path d="M 285 200 L 315 200 L 300 220 Z" fill="#0284c7"/>
  <!-- Surrounding Crops (Groundnut / Pulses) -->
  <g fill="#15803d">
    <circle cx="30" cy="240" r="12"/><circle cx="50" cy="250" r="14"/><circle cx="35" cy="270" r="13"/>
    <circle cx="560" cy="230" r="14"/><circle cx="575" cy="250" r="16"/><circle cx="550" cy="270" r="12"/>
    <circle cx="80" cy="380" r="15"/><circle cx="520" cy="380" r="16"/>
  </g>
  <!-- Solar Pump / Micro-irrigation pipe -->
  <line x1="450" y1="280" x2="550" y2="320" stroke="#000000" stroke-width="4"/>
  <rect x="535" y="170" width="30" height="40" rx="2" fill="#1e3a8a" transform="rotate(-15 535 170)"/>
  
  <!-- Geotag HUD Overlay -->
  <rect x="20" y="20" width="220" height="64" rx="6" fill="#0f172a" fill-opacity="0.75"/>
  <text x="32" y="42" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">GEO-OBS: FP-12 (14.482°N, 77.610°E)</text>
  <text x="32" y="60" fill="#86efac" font-family="sans-serif" font-size="11">HDPE Lined Farm Pond • Ananthapuramu</text>
  <text x="32" y="74" fill="#cbd5e1" font-family="sans-serif" font-size="10">Capacity: 2,700 m³ | Irrigates: 4.5 Acres</text>
</svg>
