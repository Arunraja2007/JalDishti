<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="lakeSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="100%" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="lakeWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0f4c81"/></linearGradient>
    <linearGradient id="stoneGhat" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#b45309"/><stop offset="50%" stop-color="#d97706"/><stop offset="100%" stop-color="#b45309"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#lakeSky)"/>
  
  <!-- Surrounding low hills -->
  <path d="M 0 160 Q 180 120 340 150 T 600 130 L 600 400 L 0 400 Z" fill="#65a30d" opacity="0.7"/>
  
  <!-- Wide Lake Water Spread -->
  <path d="M 40 180 C 180 160 420 160 560 180 C 590 280 540 370 300 370 C 60 370 10 280 40 180 Z" fill="url(#lakeWater)"/>
  <ellipse cx="300" cy="270" rx="220" ry="60" fill="#38bdf8" opacity="0.3"/>
  
  <!-- Historical Stone Masonry Ghat & Spillway (Chandela Style) -->
  <polygon points="180,310 420,310 460,370 140,370" fill="url(#stoneGhat)"/>
  <line x1="200" y1="330" x2="400" y2="330" stroke="#78350f" stroke-width="3"/>
  <line x1="170" y1="350" x2="430" y2="350" stroke="#78350f" stroke-width="3"/>
  
  <!-- Rejuvenation Silt Desilting Marker -->
  <circle cx="100" cy="220" r="18" fill="#15803d"/>
  <circle cx="500" cy="210" r="22" fill="#15803d"/>
  
  <!-- Geotag HUD Overlay -->
  <rect x="20" y="20" width="245" height="64" rx="6" fill="#0f172a" fill-opacity="0.75"/>
  <text x="32" y="42" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">GEO-OBS: WB-06 (24.945°N, 78.732°E)</text>
  <text x="32" y="60" fill="#86efac" font-family="sans-serif" font-size="11">Chandela Percolation Tank • Tikamgarh</text>
  <text x="32" y="74" fill="#cbd5e1" font-family="sans-serif" font-size="10">Capacity: 620,000 m³ | Wells Recharged: 48</text>
</svg>
