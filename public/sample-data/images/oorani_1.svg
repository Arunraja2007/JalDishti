<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ooraniSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="100%" stop-color="#f8fafc"/></linearGradient>
    <linearGradient id="cleanWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#ooraniSky)"/>
  <polygon points="0,140 600,140 600,400 0,400" fill="#a7f3d0"/>
  
  <!-- Stepped Stone Revetment of Oorani Pond -->
  <polygon points="100,180 500,180 560,370 40,370" fill="#cbd5e1"/>
  <polygon points="130,210 470,210 520,350 80,350" fill="url(#cleanWater)"/>
  
  <!-- Steps / Stepped Ghats -->
  <line x1="120" y1="195" x2="480" y2="195" stroke="#64748b" stroke-width="3"/>
  <line x1="100" y1="230" x2="500" y2="230" stroke="#64748b" stroke-width="3"/>
  
  <!-- Protective Bio-fencing Trees -->
  <g fill="#166534">
    <circle cx="50" cy="180" r="22"/><circle cx="550" cy="180" r="22"/>
    <circle cx="30" cy="240" r="25"/><circle cx="570" cy="240" r="25"/>
  </g>
  
  <!-- Solar Water Purification System Kiosk -->
  <rect x="420" y="130" width="50" height="45" rx="3" fill="#3b82f6"/>
  <polygon points="410,130 480,130 470,110 420,110" fill="#1e3a8a"/>
  
  <!-- Geotag HUD Overlay -->
  <rect x="20" y="20" width="240" height="64" rx="6" fill="#0f172a" fill-opacity="0.75"/>
  <text x="32" y="42" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">GEO-OBS: OOR-09 (9.815°N, 77.942°E)</text>
  <text x="32" y="60" fill="#86efac" font-family="sans-serif" font-size="11">Traditional Oorani Drinking Pond • Vaigai</text>
  <text x="32" y="74" fill="#cbd5e1" font-family="sans-serif" font-size="10">Capacity: 42,000 m³ | Beneficiaries: 420 HH</text>
</svg>
